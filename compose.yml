version: '3.9'

services:

  frontend:
    image: priyankayadav2111/frontend-app:latest

    container_name: frontend-container

    ports:
      - "3001:80"

    depends_on:
      - backend

    networks:
      - frontend-network


  backend:
    image: priyankayadav2111/backend-app:latest

    container_name: backend-container

    ports:
      - "5001:5000"

    volumes:
      - backend_logs:/app/logs

    networks:
      - frontend-network


volumes:
  backend_logs:


networks:
  frontend-network:
    driver: bridge